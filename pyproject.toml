[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "blackwood-onebridge"
version = "0.2.0"
description = "Single-closure road network analysis of hospital access"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE", "NOTICE.md"]
dependencies = [
    "networkx>=3.2,<4",
    "shapely>=2.1,<3",
    "pyproj>=3.6,<4",
]

[project.optional-dependencies]
report = ["matplotlib>=3.8,<4"]
prepare = ["osmnx==2.1.1", "osmium>=4.3,<5", "pyogrio>=0.7,<1"]
test = ["pytest>=8,<10"]

[project.scripts]
onebridge = "onebridge.cli:main"

[project.urls]
Repository = "https://github.com/gfonseca-labs/onebridge"
Issues = "https://github.com/gfonseca-labs/onebridge/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
